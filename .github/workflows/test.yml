name: test
on: [push, pull_request]

# Tests only need to read the code.
permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: luac5.1 -p SpicyKillStreaks/SpicyKillStreaks.lua SpicyKillStreaks/UI.lua SpicyKillStreaks/Kudos.lua SpicyKillStreaks/Aid.lua SpicyKillStreaks/Friends.lua SpicyKillStreaks/Kos.lua
      - name: UI smoke test (fake WoW API, real addon and Ace3)
        run: lua5.1 tests/ui_smoke.lua SpicyKillStreaks
      - name: Version strings agree
        run: scripts/check-release.sh versions
      - name: No BOM in the .toc (it stops the addon loading)
        run: |
          if head -c3 SpicyKillStreaks/SpicyKillStreaks.toc | grep -q $'\xEF\xBB\xBF'; then
            echo "::error::SpicyKillStreaks.toc starts with a UTF-8 BOM"; exit 1
          fi
      - name: Every sound has its quiet copy (tools/make_quiet.sh)
        run: |
          cd SpicyKillStreaks/sounds
          missing=0
          while read -r f; do
            q="quiet/${f#./}"; q="${q%.*}.ogg"
            if [ ! -f "$q" ]; then echo "::error::no quiet copy of $f (run tools/make_quiet.sh)"; missing=1; fi
          done < <(find . \( -path ./quiet -o -path ./custom \) -prune -o -type f \( -name '*.ogg' -o -name '*.mp3' \) -print)
          exit $missing
